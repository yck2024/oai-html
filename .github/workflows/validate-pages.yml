name: Validate published pages

on:
  pull_request:
    branches: [main]
  push:
    branches: ["fm/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate page manifest and published page directories
        run: python .github/scripts/validate_pages.py

      - name: Test storybook engine and every series
        run: |
          node engine/build.js --check
          node engine/build-stories.js --check
          node --test engine/*.test.js
          node --test monster-word-arena-tw/*.test.js
          node --test math-island/*.test.js math-island/poko/*.test.js math-island/dino-spirit/*.test.js
