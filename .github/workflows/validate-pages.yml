name: Validate published pages

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected SHA of the selected ref (must match its current head)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify manual run targets the expected commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "Selected ref is at $GITHUB_SHA, expected $EXPECTED_SHA" >&2
            exit 1
          fi

      - name: Validate page manifest and published page directories
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("pages.json").read_text(encoding="utf-8"))
          pages = manifest.get("pages", [])
          if not isinstance(pages, list):
              raise SystemExit("pages.json: 'pages' must be a list")

          slugs = []
          for page in pages:
              slug = page.get("slug", "")
              if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
                  raise SystemExit(f"Invalid slug: {slug!r}")
              if not page.get("title") or not page.get("description"):
                  raise SystemExit(f"Missing title/description for {slug}")
              slugs.append(slug)

          if len(slugs) != len(set(slugs)):
              raise SystemExit("Duplicate slugs in pages.json")

          listed = set(slugs)
          actual = {
              p.parent.name
              for p in Path(".").glob("*/index.html")
              if not p.parent.name.startswith(".")
          }

          missing_files = listed - actual
          missing_manifest = actual - listed
          if missing_files:
              raise SystemExit(f"Manifest entries without pages: {sorted(missing_files)}")
          if missing_manifest:
              raise SystemExit(f"Published pages missing from pages.json: {sorted(missing_manifest)}")

          print(f"Validated {len(slugs)} published pages")
          PY
