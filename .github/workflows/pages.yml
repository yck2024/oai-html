name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate page manifest
        run: python .github/scripts/validate_pages.py

      - name: Add analytics to pages missing it
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          ga = """<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-QLFWNZWDSS"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-QLFWNZWDSS', { content_group: 'oai-html' });
          </script>"""

          helper = '<script defer src="https://yck2024.github.io/oai-html/assets/analytics.js"></script>'

          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue

              html = path.read_text(encoding="utf-8")
              additions = []

              if "G-QLFWNZWDSS" not in html:
                  additions.append(ga)
              if "assets/analytics.js" not in html:
                  additions.append(helper)

              if not additions:
                  continue

              match = re.search(r"<head\b[^>]*>", html, flags=re.IGNORECASE)
              if not match:
                  raise SystemExit(f"No <head> found in {path}")

              injected = match.group(0) + "\n" + "\n".join(additions)
              html = html[:match.start()] + injected + html[match.end():]
              path.write_text(html, encoding="utf-8")
              print(f"Injected analytics: {path}")
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
