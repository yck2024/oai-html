<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9f4cf">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QLFWNZWDSS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QLFWNZWDSS', { content_group: 'oai-html' });
  </script>
  <script defer src="https://yck2024.github.io/oai-html/assets/analytics.js"></script>
  <title>ラグと こだま森のひかり｜Math Island</title>
  <link rel="stylesheet" href="./game.css">
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="menu-link" href="../index.html" aria-label="Math Island のゲーム一覧にもどる">← ゲームを えらぶ</a>
      <div class="top-actions">
        <span class="game-label">GAME 3</span>
        <button class="restart-button" id="restartButton" type="button">↻ はじめから</button>
      </div>
    </header>

    <section class="intro" aria-labelledby="gameTitle">
      <p class="eyebrow">こだま森の ぼうけん</p>
      <h1 id="gameTitle">ラグと こだま森のひかり</h1>
      <p class="intro-copy">ちいさな きょうりゅうのラグと、森のせいポワ。<br class="desktop-break">かくれた ひかりだまを みつけよう！</p>
    </section>

    <section class="game-layout" aria-label="ひかりだまを あつめるゲーム">
      <section class="forest-card" aria-label="ラグとポワのいる森">
        <div class="scene-wrap">
          <svg class="forest-scene" viewBox="0 0 600 330" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#bceee8"/><stop offset="1" stop-color="#f2f6c6"/></linearGradient>
              <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#a9d993"/><stop offset="1" stop-color="#70b879"/></linearGradient>
              <radialGradient id="glow"><stop stop-color="#fff9b3"/><stop offset="1" stop-color="#f4c95d"/></radialGradient>
            </defs>
            <rect width="600" height="330" rx="24" fill="url(#sky)"/>
            <circle cx="500" cy="57" r="29" fill="#fff5b0" opacity=".9"/>
            <path d="M0 202Q112 115 222 205T442 193T650 200V330H0Z" fill="#c2e4a5"/>
            <path d="M0 246Q133 178 275 240T600 226V330H0Z" fill="url(#hill)"/>
            <g fill="#579a69">
              <path d="M40 217V119h18v98zM20 152q29-59 58 0z"/><path d="M525 222V105h20v117zM500 146q35-69 70 0z"/>
              <path d="M111 230V164h13v66zM94 183q24-44 48 0z"/><path d="M445 226V159h13v67zM427 178q24-45 49 0z"/>
            </g>
            <g fill="#86c784" opacity=".9"><circle cx="81" cy="80" r="6"/><circle cx="145" cy="55" r="4"/><circle cx="416" cy="75" r="5"/><circle cx="545" cy="93" r="4"/></g>
            <g class="forest-lights" aria-hidden="true">
              <circle class="forest-light" cx="70" cy="106" r="8" fill="url(#glow)"/>
              <circle class="forest-light" cx="255" cy="32" r="7" fill="url(#glow)"/>
              <circle class="forest-light" cx="372" cy="92" r="8" fill="url(#glow)"/>
              <circle class="forest-light" cx="345" cy="165" r="7" fill="url(#glow)"/>
              <circle class="forest-light" cx="565" cy="32" r="8" fill="url(#glow)"/>
            </g>
            <path d="M0 292q60-24 119 0t118 0 118 0 118 0 127 0" fill="none" stroke="#d8ef9a" stroke-width="5" stroke-linecap="round"/>
            <g fill="#eaf6bf"><path d="M87 283q-13-22-27-13 10 19 27 13m0 0q15-21 27-12-9 18-27 12"/><path d="M510 278q-11-19-24-11 9 16 24 11m0 0q13-18 25-10-8 16-25 10"/></g>
          </svg>
          <div class="scene-art">
            <img class="forest-prop prop-acorn" src="./images/acorn.webp" alt="" width="297" height="356" decoding="async">
            <img class="forest-prop prop-flower" src="./images/woodland-flower.webp" alt="" width="369" height="366" decoding="async">
            <img class="forest-prop prop-blue-mushroom" src="./images/blue-mushroom.webp" alt="" width="348" height="334" decoding="async">
            <img class="character-art rag" src="./images/rag.webp" alt="葉っぱの背びれと茶色のかばんを持った、緑の恐竜ラグ" width="759" height="894" decoding="async">
            <img class="character-art powa" src="./images/powa.webp" alt="葉っぱのかんむりをかぶり、光るしっぽを引く森のせいポワ" width="617" height="997" decoding="async">
          </div>
        </div>
        <div class="forest-caption">
          <span class="character-name">ラグ</span>
          <span class="caption-divider" aria-hidden="true">＋</span>
          <span class="character-name spirit-name">ポワ</span>
        </div>
        <p class="forest-hint" id="forestHint">こたえが あたると、森に ひかりが もどるよ。</p>
      </section>

      <section class="quiz-card" aria-label="さんすうクイズ">
        <div class="progress-top">
          <span class="progress-title">ひかりだま</span>
          <span id="progressText" class="progress-count">0 / 5</span>
        </div>
        <div id="progressBar" class="progress-track" role="progressbar" aria-label="あつめた ひかりだま" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="progress-dots" id="progressDots" aria-hidden="true"></div>
        <div class="mode-switch" role="group" aria-label="もんだいの しゅるい">
          <button class="mode-button selected" id="additionModeButton" type="button" aria-pressed="true">たしざん</button>
          <button class="mode-button" id="subtractionModeButton" type="button" aria-pressed="false">ひきざん</button>
        </div>

        <div id="questionArea">
          <p class="question-label" id="questionLabel">もんだい 1</p>
          <p class="instruction" id="instruction">ひかりだまは あわせて いくつ？</p>
          <button class="speak-button" id="speakButton" type="button" aria-label="もういちど きく">
            <svg class="speak-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> <span>もういちど きく</span>
          </button>
          <p class="speech-status" id="speechStatus" role="status" aria-live="polite" aria-atomic="true"></p>
          <div class="equation" id="equation" aria-label="たしざんの もんだい"></div>
          <p class="key-hint">こたえを タップしてね <span>（1・2・3キーも つかえるよ）</span></p>
          <div class="answers" id="answers" role="group" aria-label="こたえを えらぶ"></div>
          <p class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
          <button class="next-button" id="nextButton" type="button" hidden>つぎの ひかりへ <span aria-hidden="true">➜</span></button>
        </div>

        <section id="finishPanel" class="finish-panel" aria-labelledby="finishTitle" hidden>
          <div class="reward-icon" aria-hidden="true"><img src="./images/rag.webp" alt="" width="759" height="894" decoding="async"><img src="./images/powa.webp" alt="" width="617" height="997" decoding="async"></div>
          <h2 id="finishTitle">やったね！</h2>
          <p>5この ひかりだまが あつまった！<br>こだま森に あかるいひかりが もどったよ。</p>
          <div class="reward-badge"><img class="inline-art" src="./images/acorn.webp" alt="" width="297" height="356" decoding="async"> こだま森の たんけんバッジ</div>
          <button class="next-button replay-button" id="replayButton" type="button">もういちど あそぶ <span aria-hidden="true">↻</span></button>
        </section>
      </section>
    </section>
    <p class="page-footer">ゆっくり かんがえて だいじょうぶ <img class="inline-art" src="./images/woodland-flower.webp" alt="" width="369" height="366" decoding="async"></p>
  </main>
  <script src="./game.js"></script>
</body>
</html>
