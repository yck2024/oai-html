<style>
:root{--ink:#24405b;--blue:#63b8f2;--pink:#ff8da1;--yellow:#ffd95b;--green:#63c58d;--paper:#fffef9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#c9efff 0,#edfaff 52%,#fff4d7 100%);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;color:var(--ink)}

.fallback-scene{position:absolute;inset:0;display:grid;place-items:center;z-index:0}
.fallback-island{width:min(600px,85vw);height:200px;border-radius:50%;background:radial-gradient(ellipse at 50% 36%,#9be58e 0 45%,#62c781 46% 61%,#e9c98a 62% 67%,#42bce0 68% 100%);box-shadow:0 20px 0 #d8ad69;display:flex;align-items:center;justify-content:center;gap:17px;font-size:clamp(32px,6vw,58px)}

.cloud.one{left:12%}.cloud.two{right:13%;top:22%;font-size:38px}
.scene-vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,#fff4 0%,transparent 25%,transparent 72%,#315f4620 100%)}
.game-ui{position:absolute;z-index:4;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.78fr);align-items:end;gap:14px;padding:0 22px 22px}
.question-card{background:#fffef4f2;border:3px solid #fff;border-radius:27px;padding:16px 20px 17px;box-shadow:0 8px 0 #d2e3c9;min-height:150px}
.question-title{font-size:clamp(22px,3.2vw,32px);font-weight:1000;line-height:1.2;margin:0;text-align:center;letter-spacing:.015em}
.visual{display:flex;justify-content:center;align-items:center;gap:9px;min-height:50px;margin:8px auto 0;font-size:clamp(28px,4.2vw,42px);flex-wrap:wrap}
.visual-group{display:inline-flex;gap:2px;position:relative;padding:0 4px}

.visual-icon.pop{animation:pop .42s ease}
.visual-icon .badge{position:absolute;top:-8px;right:-8px;border-radius:99px;background:#fff;padding:1px 5px;color:#53768c;border:2px solid #89c9e8;font-size:12px;font-weight:900}
.operator{font-size:25px;font-weight:900;color:#5d89a4;padding:0 2px}
.feedback{min-height:21px;margin:4px 0 0;text-align:center;font-size:14px;font-weight:800;color:#5285a2}
.answer-area{display:flex;flex-direction:column;gap:9px}
.answer-label{text-align:center;color:#fff;font-weight:900;text-shadow:0 2px 5px #426c60;font-size:15px}

.answer{min-height:76px;border:3px solid #fff;border-radius:22px;background:#fff;color:#37617b;font-size:30px;font-weight:1000;box-shadow:0 7px 0 #a6d3df;transition:transform .12s,box-shadow .12s,background .2s}
.answer:hover{transform:translateY(-3px);box-shadow:0 10px 0 #a6d3df}
.answer:active{transform:translateY(3px);box-shadow:0 3px 0 #a6d3df}
.answer small{font-size:16px;margin-left:2px}
.answer.correct{background:#d8ffdc;border-color:#fff;animation:pop .35s ease}
.answer.wrong{animation:shake .3s ease;background:#fff0e7}
.tools{display:flex;justify-content:center;gap:8px;margin-top:6px}
.tiny-btn{border:0;background:#ffffffd9;color:#4d748a;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900}
.tiny-btn:hover{background:white}
.progress{position:absolute;z-index:4;top:71px;left:50%;transform:translateX(-50%);border-radius:999px;padding:7px 13px;background:#ffffffd9;color:#46708a;font-size:13px;font-weight:900;white-space:nowrap}
.overlay{position:absolute;z-index:8;inset:0;display:grid;place-items:center;overflow-y:auto;padding:20px;background:#ecfaffba;backdrop-filter:blur(5px)}
.overlay-card{width:min(620px,100%);margin:auto;padding:25px 25px 23px;background:#fff;border:4px solid #fff;border-radius:32px;text-align:center;box-shadow:0 13px 0 #c4e6eb,0 24px 55px #447e9633}
.hero{font-size:68px;line-height:1;margin:3px auto 8px;filter:drop-shadow(0 5px 0 #e5d198)}
.overlay h2{margin:5px 0 8px;font-size:clamp(25px,5vw,37px);font-weight:1000;color:#315879}
.overlay p{margin:0 auto 16px;max-width:440px;color:#678398;font-size:15px;font-weight:700;line-height:1.7}
.mode-list{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:17px}
.mode-card{border:0;border-radius:24px;padding:17px 12px 16px;font-size:18px;font-weight:1000;box-shadow:0 6px 0 #c8dfdc;transition:transform .13s,filter .13s}
.mode-card:hover{transform:translateY(-3px);filter:brightness(1.03)}
.mode-card.count{background:#dff7ff;color:#376883;box-shadow:0 6px 0 #b2dce9}
.mode-card.add{background:#fff0ca;color:#856126;box-shadow:0 6px 0 #e9d39c}
.mode-card .emoji{display:block;font-size:35px;margin-bottom:5px}
.mini-note{margin-top:17px!important;font-size:12px!important;color:#8ba0ac!important}
.primary-btn{border:0;border-radius:20px;background:#72c98e;color:#fff;padding:14px 24px;font-size:18px;font-weight:1000;box-shadow:0 6px 0 #48a768}
.primary-btn:hover{transform:translateY(-2px)}
.hidden{display:none!important}
@keyframes pop{0%{transform:scale(.7)}65%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media(max-width:720px){
 .page{padding:10px 10px 18px}.header-note{display:inline-flex;padding:8px 10px;font-size:11px}.brand-mark{width:42px;height:42px}.game-shell{height:min(780px,calc(100vh - 90px));min-height:450px;height:min(780px,calc(100svh - 90px));border-width:5px;border-radius:27px}
 .scene{height:54%;bottom:auto}.game-ui{grid-template-columns:1fr;gap:8px;bottom:0;padding:0 12px 13px}
 .question-card{min-height:126px;padding:12px 11px 10px;border-radius:23px}.question-title{font-size:25px}
 .visual{min-height:39px;margin:6px auto 0}.feedback{min-height:18px;font-size:12px}
 .answer-area{gap:5px}.answer-label{color:#527d64;text-shadow:none;font-size:13px}.answers{gap:8px}.answer{min-height:66px;font-size:27px;border-radius:18px}
 .progress{top:61px}.topbar{top:11px;left:11px;right:11px}.soft-btn{padding:9px 11px}
 .overlay-card{padding:21px 17px;border-radius:28px}.hero{font-size:56px}.mode-list{gap:9px}.mode-card{font-size:16px;padding:15px 8px}
}
@media(max-height:700px) and (min-width:721px){.game-shell{min-height:600px}.question-card{min-height:130px}.answer{min-height:65px}}
</style>

<body>
<div class="page">
<header>
 <div class="brand">
  <div class="brand-mark" aria-hidden="true">🦊</div>
  <div><h1>ポコと ほしの島</h1><p>あそびながら かずを おぼえよう</p></div>
 </div>
 <a class="header-note" href="../" aria-label="Math Island のゲーム一覧にもどる">← ゲーム一覧</a>

<main class="game-shell" id="game">
 <div class="scene" id="scene">

 </section>
 <div class="overlay" id="intro">
  <div class="overlay-card">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script>
(function(){
 "use strict";
 var score=0, round=0, mode="count", current=null, hintOn=false, locked=false;
 var sceneEl=document.getElementById("scene");
 var questionEl=document.getElementById("question");
 var visualEl=document.getElementById("visual");
 var feedbackEl=document.getElementById("feedback");
 var answersEl=document.getElementById("answers");
 var scoreEl=document.getElementById("score");
 var progressEl=document.getElementById("progress");
 var gameUi=document.getElementById("gameUi");
 var intro=document.getElementById("intro");
 var ending=document.getElementById("ending");
 var applesGroup=null, renderer=null, threeScene=null, camera=null, fox=null, bobTime=0, currentAudio=null;
 var appleSpots=[[-1.65,.84,.8],[-.75,.84,1.2],[.15,.84,.9],[1.1,.84,1.25],[2.0,.84,.8]];

 function playAudio(clip){
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;}
  currentAudio=new Audio("./audio/"+clip+".mp3");
  currentAudio.play().catch(function(){});
 }
 function speakQuestion(){
  if(!current)return;
  playAudio(current.kind==="add"?"poko-add-"+current.a+"-"+current.b:"poko-count");
 }
 function mat(color,roughness){return new THREE.MeshStandardMaterial({color:color,roughness:roughness||.84})}
 function addMesh(parent,geo,material,x,y,z,sx,sy,sz){
  var mesh=new THREE.Mesh(geo,material);
  mesh.position.set(x,y,z);
  if(sx!==undefined)mesh.scale.set(sx,sy,sz);
  mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;
 }
 function makeSphere(parent,color,x,y,z,sx,sy,sz){
  return addMesh(parent,new THREE.SphereGeometry(1,24,18),mat(color),x,y,z,sx,sy,sz);
 }
 function addTree(x,z,size){
  var trunk=mat("#a96943");
  addMesh(threeScene,new THREE.CylinderGeometry(.11*size,.15*size,.72*size,10),trunk,x,.77*size,z,1,1,1);
  makeSphere(threeScene,"#55bd75",x,.77+1.02*size,z,.55*size,.68*size,.5*size);
  makeSphere(threeScene,"#76d783",x-.22*size,1.16*size,z+.14*size,.38*size,.42*size,.35*size);
  makeSphere(threeScene,"#45ab68",x+.28*size,1.02*size,z-.14*size,.36*size,.43*size,.33*size);
 }
 function addFlower(x,z,color){
  var stem=mat("#38955e"), petal=mat(color), center=mat("#ffdc65");
  addMesh(threeScene,new THREE.CylinderGeometry(.035,.045,.42,8),stem,x,.76,z,1,1,1);
  for(var i=0;i<5;i++){
   var a=i*Math.PI*2/5;
   makeSphere(threeScene,color,x+Math.cos(a)*.12,.98,z+Math.sin(a)*.12,.105,.1,.1);
  }
  makeSphere(threeScene,"#ffdc65",x,1.0,z,.09,.09,.09);
 }
 function addCloud(x,y,z,s){
  var g=new THREE.Group();g.position.set(x,y,z);threeScene.add(g);
  makeSphere(g,"#fff",0,0,0,.65*s,.31*s,.35*s);
  makeSphere(g,"#fff",-.36*s,-.02*s,0,.37*s,.28*s,.34*s);
  makeSphere(g,"#fff",.34*s,.04*s,0,.42*s,.33*s,.36*s);
 }
 function makeFox(){
  var g=new THREE.Group();g.position.set(-2.0,.82,1.2);threeScene.add(g);
  makeSphere(g,"#f38b48",0,0,0,.55,.48,.55);
  makeSphere(g,"#ffad61",.02,.44,-.06,.43,.43,.42);
  makeSphere(g,"#fff0d4",.04,.31,.3,.29,.2,.23);
  var earMat=mat("#ef8345"), inner=mat("#ffd2a8");
  var left=addMesh(g,new THREE.ConeGeometry(.17,.42,14),earMat,-.25,.82,-.08,1,1,1);left.rotation.z=.22;
  var right=addMesh(g,new THREE.ConeGeometry(.17,.42,14),earMat,.29,.82,-.08,1,1,1);right.rotation.z=-.22;
  makeSphere(g,"#ffd2a8",-.25,.78,.035,.075,.17,.06);
  makeSphere(g,"#ffd2a8",.29,.78,.035,.075,.17,.06);
  makeSphere(g,"#273c4c",-.12,.48,.32,.045,.06,.04);
  makeSphere(g,"#273c4c",.18,.48,.32,.045,.06,.04);
  makeSphere(g,"#26394a",.05,.31,.505,.055,.045,.045);
  var tail=addMesh(g,new THREE.ConeGeometry(.24,.6,16),mat("#e97c3d"),-.55,.23,-.15,1,1,1);
  tail.rotation.z=Math.PI/2.8;
  makeSphere(g,"#fff3df",-.73,.42,-.15,.15,.14,.15);
  return g;
 }
 function setupThree(){
  if(!window.THREE || !sceneEl)return;
  try{
   threeScene=new THREE.Scene();
   camera=new THREE.PerspectiveCamera(33,1,.1,100);
   camera.position.set(8.2,8.8,11.8);camera.lookAt(0,.65,0);
   renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
   renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
   renderer.shadowMap.enabled=true;
   renderer.shadowMap.type=THREE.PCFSoftShadowMap;
   renderer.outputColorSpace=THREE.SRGBColorSpace;
   renderer.setClearColor(0x000000,0);
   sceneEl.appendChild(renderer.domElement);
   threeScene.add(new THREE.HemisphereLight(0xdaf5ff,0x76a96e,2.1));
   var sun=new THREE.DirectionalLight(0xfff4d5,2.6);
   sun.position.set(-5,10,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);threeScene.add(sun);
   var water=mat("#3bb9dc");
   addMesh(threeScene,new THREE.CylinderGeometry(6.2,6.4,.16,64),water,0,-.28,0,1,1,1);
   var sand=mat("#edca87");
   addMesh(threeScene,new THREE.CylinderGeometry(5.35,5.55,.8,64),sand,0,.03,0,1,1,1);
   var grass=mat("#74d681");
   addMesh(threeScene,new THREE.CylinderGeometry(5.28,5.35,.3,64),grass,0,.52,0,1,1,1);
   var pathmat=mat("#dfc38c");
   var path=addMesh(threeScene,new THREE.SphereGeometry(1,28,14),pathmat,.35,.69,2.52,1.0,.13,1.7);
   path.rotation.y=.25;
   addTree(-3.1,-1.4,1.1);addTree(3.45,-1.5,.95);addTree(3.45,1.6,.82);
   addFlower(-3.1,.9,"#ff8aa0");addFlower(3.05,.35,"#fff1a1");addFlower(-3.4,-.1,"#c19dff");
   addCloud(-4.1,3.4,-1,.9);addCloud(3.7,4.2,-2,.7);addCloud(.2,4.8,-3,1);
   fox=makeFox();
   applesGroup=new THREE.Group();threeScene.add(applesGroup);
   resizeThree();
   window.addEventListener("resize",resizeThree);
   animate();
  }catch(err){
   if(renderer){renderer.dispose();renderer.domElement.remove();renderer=null;}
  }
 }
 function resizeThree(){
  if(!renderer||!camera)return;
  var rect=sceneEl.getBoundingClientRect();
  var w=Math.max(1,rect.width),h=Math.max(1,rect.height);
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
 }
 function animate(){
  if(!renderer)return;
  requestAnimationFrame(animate);
  bobTime+=.018;
  if(fox)fox.position.y=.82+Math.sin(bobTime)*.035;
  if(applesGroup)applesGroup.children.forEach(function(a,i){a.position.y=.84+Math.sin(bobTime*1.4+i)*.045;});
  renderer.render(threeScene,camera);
 }
 function makeApple(){
  var g=new THREE.Group();
  makeSphere(g,"#ed5260",0,0,0,.28,.3,.28);
  makeSphere(g,"#ff7580",-.1,.06,.09,.115,.13,.12);
  addMesh(g,new THREE.CylinderGeometry(.025,.035,.13,8),mat("#795239"),0,.3,0,1,1,1);
  var leaf=makeSphere(g,"#58b95f",.09,.34,.02,.12,.045,.065);leaf.rotation.z=-.35;
  return g;
 }
 function setApples(total,split){
  if(!applesGroup||!window.THREE)return;
  while(applesGroup.children.length){applesGroup.remove(applesGroup.children[0]);}
  var spots=appleSpots.slice();
  if(split!==null && split!==undefined){
   spots=[];
   var leftCount=split, rightCount=total-split;
   for(var i=0;i<leftCount;i++)spots.push([-2.1+(i%2)*.55,.84,.2+Math.floor(i/2)*.5]);
   for(var j=0;j<rightCount;j++)spots.push([.05+(j%2)*.55,.84,.2+Math.floor(j/2)*.5]);
  }
  for(var k=0;k<total;k++){
   var apple=makeApple(),p=spots[k%spots.length];apple.position.set(p[0],p[1],p[2]);applesGroup.add(apple);
  }
 }
 function clearVisual(){visualEl.innerHTML="";}
 function visualGroup(count,offset){
  var group=document.createElement("span");group.className="visual-group";
  for(var i=0;i<count;i++){
   var item=document.createElement("span");item.className="visual-icon";item.textContent="🍎";
   if(hintOn){var badge=document.createElement("small");badge.className="badge";badge.textContent=String(offset+i+1);item.appendChild(badge);}
   group.appendChild(item);
  }
  visualEl.appendChild(group);
 }
 function renderVisual(){
  clearVisual();
  if(current.kind==="add"){
   visualGroup(current.a,0);
   var plus=document.createElement("span");plus.className="operator";plus.textContent="+";
   visualEl.appendChild(plus);
   visualGroup(current.b,current.a);
  }else visualGroup(current.answer,0);
 }
 function chooseOptions(answer){
  var all=[1,2,3,4,5],values=[answer];
  all.sort(function(a,b){return Math.abs(a-answer)-Math.abs(b-answer);});
  for(var i=0;i<all.length&&values.length<3;i++)if(all[i]!==answer)values.push(all[i]);
  for(var j=values.length-1;j>0;j--){var n=Math.floor(Math.random()*(j+1)),tmp=values[j];values[j]=values[n];values[n]=tmp;}
  return values;
 }
 function newQuestion(){
  locked=false;hintOn=false;
  var answer,a,b,kind=mode;
  if(kind==="count"){
   answer=1+Math.floor(Math.random()*5);
   current={kind:"count",answer:answer};
   questionEl.textContent="りんごは いくつ？";
   setApples(answer,null);
  }else{
   a=1+Math.floor(Math.random()*3);
   b=1+Math.floor(Math.random()*(5-a));
   answer=a+b;
   current={kind:"add",a:a,b:b,answer:answer};
   questionEl.textContent=a+"こ と "+b+"こ。あわせて いくつ？";
   setApples(answer,a);
  }
  renderVisual();
  feedbackEl.textContent=round===0?"ゆっくり かぞえてみよう！":"つぎの もんだいだよ！";
  answersEl.innerHTML="";
  chooseOptions(answer).forEach(function(value){
   var button=document.createElement("button");button.type="button";button.className="answer";
   button.innerHTML=String(value)+"<small>こ</small>";
   button.addEventListener("click",function(){answerQuestion(value,button);});
   answersEl.appendChild(button);
  });
  progressEl.textContent="もんだい "+(round+1)+" / 8";
  speakQuestion();
 }
 function answerQuestion(value,button){
  if(locked)return;
  if(value===current.answer){
   locked=true;button.classList.add("correct");score++;round++;scoreEl.textContent=String(score);
   feedbackEl.textContent="せいかい！ ほしを ゲット ⭐";
   playAudio("poko-correct");
   if(round>=8){
    window.setTimeout(function(){
     gameUi.classList.add("hidden");progressEl.classList.add("hidden");
     document.getElementById("endingText").textContent="ほしを 8こ あつめたよ！ ポコと いっしょに おいわいしよう。";
     ending.classList.remove("hidden");
     playAudio("poko-finish");
    },1500);
   }else window.setTimeout(newQuestion,1500);
  }else{
   button.classList.add("wrong");
   feedbackEl.textContent="おしい！ りんごを もういちど かぞえてみよう。";
   playAudio("poko-try-again");
   window.setTimeout(function(){button.classList.remove("wrong");},400);
  }
 }
 function startGame(nextMode){
  mode=nextMode;score=0;round=0;scoreEl.textContent="0";
  intro.classList.add("hidden");ending.classList.add("hidden");
  gameUi.classList.remove("hidden");progressEl.classList.remove("hidden");
  newQuestion();
 }
 document.querySelectorAll(".mode-card").forEach(function(btn){
  btn.addEventListener("click",function(){startGame(btn.getAttribute("data-mode"));});
 });
 document.getElementById("menuBtn").addEventListener("click",function(){
  ending.classList.add("hidden");gameUi.classList.add("hidden");progressEl.classList.add("hidden");
  intro.classList.remove("hidden");if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;}
 });
 document.getElementById("againBtn").addEventListener("click",function(){startGame(mode);});
 document.getElementById("hintBtn").addEventListener("click",function(){
  hintOn=true;renderVisual();feedbackEl.textContent="ばんごうを つかって かぞえてみよう！";
 });
 document.getElementById("speakBtn").addEventListener("click",function(){
  speakQuestion();
 });
 setupThree();
})();
</script>
</body>
</html>
